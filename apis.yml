aid: hidden-level
name: Hidden Level
description: >-
  Hidden Level is a U.S.-based defense and aerospace technology company that turns
  radio-frequency (RF) activity into trusted airspace intelligence. Its passive
  RF sensing platform detects and tracks unmanned aerial systems (drones) and other
  activity across air, ground, sea, and space domains without requiring emitters or
  heavy on-site infrastructure. Hidden Level packages this as hardware sensor
  platforms, software platforms, and data platforms serving defense and military,
  critical infrastructure protection, homeland security, and public safety
  customers. The company hosts its platform on AWS with least-privilege access,
  MFA, and TLS 1.3 API communications, aligns corporate controls to NIST SP 800-171,
  and emphasizes U.S. design and manufacturing. Backed by Costanoa Ventures. This
  API Evangelist profile tracks Hidden Level's public web and security surface;
  the company does not currently publish a public developer portal, API reference,
  or SDKs.
